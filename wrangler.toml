name = "vfr"
main = "src/worker.js"
compatibility_date = "2026-10-02"

# Eigene Adresse (eigene Cloudflare-Access-Application "vfr" schuetzt sie) und weiterhin die workers.dev-Adresse
routes = [{ pattern = "vfr.gubi.co.at", custom_domain = true }]
workers_dev = true

# Oberflaeche (HTML/CSS/JS) als Static Assets. run_worker_first: JEDE Anfrage geht zuerst durch den
# Worker (Passwort-Anmeldung), erst dann werden Dateien ueber die Bindung ASSETS ausgeliefert.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
